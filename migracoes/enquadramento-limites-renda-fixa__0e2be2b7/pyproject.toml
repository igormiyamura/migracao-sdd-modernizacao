[project]
name = "enquadramento-limites-renda-fixa"
version = "0.1.0"
description = "Apura o enquadramento de limites de DV01 por book da carteira de Renda Fixa e notifica por severidade"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
mypy_path = "../.."

[tool.pytest.ini_options]
testpaths = ["testes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
